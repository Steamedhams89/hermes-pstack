name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_SOURCE_ROOT: /tmp/hermes-pstack-hermes-agent
  HERMES_HOME: /tmp/hermes-pstack-profile
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_ADDOPTS: "-p no:cacheprovider"

jobs:
  verify:
    name: Source, parity, runtime, and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the port
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out the tested Hermes Agent revision
        run: |
          git init "$HERMES_SOURCE_ROOT"
          git -C "$HERMES_SOURCE_ROOT" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$HERMES_SOURCE_ROOT" fetch --depth=1 origin 4f22543509d1b91dc45bcb369447126c5eb14fb7
          git -C "$HERMES_SOURCE_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$HERMES_SOURCE_ROOT" rev-parse HEAD)" = 4f22543509d1b91dc45bcb369447126c5eb14fb7

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install the pinned Hermes runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${HERMES_SOURCE_ROOT}[dev]"

      - name: Run the complete Python suite
        run: python -B -m pytest -q -p no:cacheprovider tests

      - name: Reproduce adaptation receipts
        run: python -B tools/receipt.py --write --provision-script-deps

      - name: Require complete source and receipt parity
        run: python -B tools/verify.py --require-complete

      - name: Require deterministic checked-in receipts
        id: deterministic_receipts
        run: git diff --exit-code -- provenance/parity-ledger.json provenance/patches/index.json provenance/test-receipts.json

      - name: Diagnose Bun receipt drift
        if: steps.deterministic_receipts.outcome == 'failure'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          from tools import receipt

          root = Path.cwd()
          with tempfile.TemporaryDirectory(prefix="pstack-ci-diagnostic-") as temporary:
              scripts = Path(temporary) / "scripts"
              shutil.copytree(root / receipt.SCRIPT_ROOT, scripts, ignore=shutil.ignore_patterns("node_modules"))
              subprocess.run(
                  ["bun", "install", "--frozen-lockfile"],
                  cwd=scripts,
                  env=os.environ.copy(),
                  check=True,
                  capture_output=True,
                  text=True,
              )
              for command in receipt.TEST_SPECS["upstream-script-suite"].commands:
                  if command.argv[:2] != ("bun", "test"):
                      continue
                  result = subprocess.run(
                      command.argv,
                      cwd=scripts,
                      env=os.environ.copy(),
                      check=False,
                      capture_output=True,
                      text=True,
                  )
                  normalized = receipt._normalize_output(
                      result.stdout + result.stderr,
                      root,
                      Path(temporary) / "hermes-home",
                  )
                  print(json.dumps({
                      "argv": command.argv,
                      "exit_code": result.returncode,
                      "output_sha256": hashlib.sha256(normalized.encode()).hexdigest(),
                      "normalized_output": normalized,
                  }))
          PY

      - name: Validate all plugin packages
        run: |
          hermes plugins doctor --ci packages/pstack
          hermes plugins doctor --ci packages/pstack-runtime
          hermes plugins doctor --ci packages/pstack-benny

      - name: Validate the pinned plugin pack
        run: hermes plugins pack show hermes-pack.yaml

      - name: Reject generated residue
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          forbidden_dirs = {'node_modules', '__pycache__', '.pytest_cache', '.mypy_cache', '.ruff_cache'}
          forbidden_suffixes = {'.pyc', '.pyo'}
          offenders = []
          for path in root.rglob('*'):
              if path.parts and path.parts[0] in {'.git', 'vendor'}:
                  continue
              if any(part in forbidden_dirs for part in path.parts):
                  offenders.append(path.as_posix())
              elif path.is_file() and path.suffix in forbidden_suffixes:
                  offenders.append(path.as_posix())
          if offenders:
              raise SystemExit('generated residue:\n' + '\n'.join(sorted(set(offenders))))
          print('generated residue: none')
          PY
